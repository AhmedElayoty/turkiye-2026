<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Türkiye 2026</title>
<meta name="description" content="Private trip companion. Content is encrypted.">
<meta name="theme-color" content="#0B1F3A" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1420" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Türkiye">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<!-- ───────────────────────── LOCK SCREEN ───────────────────────── -->
<section id="lock" class="lock" aria-label="Unlock">
  <div class="lock-card">
    <img class="lock-icon" src="./icons/icon-192.png" alt="" width="84" height="84">
    <h1 class="lock-title">Türkiye 2026</h1>
    <p class="lock-sub">Antalya · Istanbul · 11–25 October</p>
    <form id="lockForm" autocomplete="off">
      <label class="field">
        <span class="field-label">Passphrase</span>
        <span class="field-row">
          <input id="pass" type="password" inputmode="text" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="word-word-word-word-word-00" required>
          <button type="button" id="togglePass" class="ghost small" aria-label="Show passphrase">Show</button>
        </span>
      </label>
      <label class="check"><input type="checkbox" id="remember" checked> <span>Remember this device</span></label>
      <button type="submit" id="unlockBtn" class="primary wide">Unlock</button>
      <p id="lockMsg" class="lock-msg" role="status"></p>
    </form>
    <p class="lock-foot">Everything in this app is encrypted on the device. Nothing personal is readable without the passphrase.</p>
  </div>
</section>

<!-- ───────────────────────── APP ───────────────────────── -->
<div id="app" class="app" hidden>
  <header class="topbar">
    <div class="topbar-left">
      <img src="./icons/icon-192.png" alt="" width="28" height="28" class="topbar-icon">
      <div>
        <div class="topbar-title">Türkiye 2026</div>
        <div id="topbarSub" class="topbar-sub">Antalya · Istanbul</div>
      </div>
    </div>
    <button id="settingsBtn" class="iconbtn" aria-label="Settings"></button>
  </header>

  <main id="main" class="main">
    <section id="view-today" class="view" data-view="today"></section>
    <section id="view-days" class="view" data-view="days" hidden></section>
    <section id="view-bookings" class="view" data-view="bookings" hidden></section>
    <section id="view-money" class="view" data-view="money" hidden></section>
    <section id="view-tips" class="view" data-view="tips" hidden></section>
  </main>

  <nav class="tabbar" aria-label="Sections">
    <button class="tab is-active" data-tab="today"><span class="tab-ico" data-ico="today"></span><span>Today</span></button>
    <button class="tab" data-tab="days"><span class="tab-ico" data-ico="days"></span><span>Days</span></button>
    <button class="tab" data-tab="bookings"><span class="tab-ico" data-ico="ticket"></span><span>Bookings</span></button>
    <button class="tab" data-tab="money"><span class="tab-ico" data-ico="wallet"></span><span>Money</span></button>
    <button class="tab" data-tab="tips"><span class="tab-ico" data-ico="bulb"></span><span>Tips</span></button>
  </nav>
</div>

<!-- ───────────────────────── PDF VIEWER ───────────────────────── -->
<div id="viewer" class="viewer" hidden>
  <div class="viewer-bar">
    <button id="viewerClose" class="iconbtn light" aria-label="Close"></button>
    <div class="viewer-title" id="viewerTitle">Document</div>
    <div class="viewer-actions">
      <a id="viewerDownload" class="iconbtn light" aria-label="Save or share" download></a>
      <a id="viewerOpen" class="iconbtn light" aria-label="Open in new tab" target="_blank" rel="noopener"></a>
    </div>
  </div>
  <div id="viewerBody" class="viewer-body"></div>
</div>

<!-- ───────────────────────── SETTINGS SHEET ───────────────────────── -->
<div id="sheet" class="sheet" hidden>
  <div class="sheet-backdrop" data-close></div>
  <div class="sheet-panel" role="dialog" aria-label="Settings">
    <div class="sheet-handle"></div>
    <h2>Settings</h2>
    <div id="installBox" class="settings-block"></div>
    <div class="settings-block">
      <label class="field"><span class="field-label">Lira per dirham (planning rate)</span>
        <span class="field-row"><input id="rateInput" type="number" step="0.01" min="5" max="30"><button id="rateLive" class="ghost small" type="button">Use live 13.24</button></span>
      </label>
    </div>
    <div class="settings-block row-buttons">
      <button id="lockNow" class="ghost">Lock now</button>
      <button id="forgetDevice" class="ghost danger">Forget this device</button>
    </div>
    <div class="settings-block row-buttons">
      <button id="resetTodos" class="ghost">Reset to-dos</button>
      <button id="resetExpenses" class="ghost danger">Delete all expenses</button>
    </div>
    <p id="versionLine" class="muted small"></p>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script type="module" src="./app.js"></script>
</body>
</html>

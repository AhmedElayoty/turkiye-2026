<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Türkiye 2026</title>
<meta name="description" content="Private trip companion. Content is encrypted.">
<meta name="theme-color" content="#14213D" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1220" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Türkiye">
<meta name="robots" content="noindex, nofollow">
<meta name="app-build" content="20261002-163527">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<!-- ───────────── LOCK ───────────── -->
<section id="lock" class="lock pending" aria-label="Unlock">
  <div class="lock-card">
    <img class="lock-icon" src="./icons/icon-192.png" alt="" width="76" height="76">
    <h1 class="lock-title">Türkiye 2026</h1>
    <p class="lock-sub">Private trip companion</p>
    <form id="lockForm" autocomplete="off">
      <label class="field">
        <span class="field-label">Passphrase</span>
        <span class="field-row">
          <input id="pass" type="password" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Your passphrase" required>
          <button type="button" id="togglePass" class="btn ghost sm" aria-label="Show passphrase">Show</button>
        </span>
      </label>
      <label class="check"><input type="checkbox" id="remember" checked> <span>Remember this device</span></label>
      <button type="submit" id="unlockBtn" class="btn primary wide">Unlock</button>
      <p id="lockMsg" class="lock-msg" role="status"></p>
    </form>
    <p class="lock-foot">Everything inside is encrypted. Without the passphrase this app is empty.</p>
  </div>
</section>

<!-- ───────────── APP ───────────── -->
<div id="app" class="app" hidden>
  <header class="topbar">
    <button class="icon-btn" id="backBtn" aria-label="Back" hidden></button>
    <div class="topbar-title"><span id="viewTitle">Today</span><small id="viewSub"></small></div>
    <button class="icon-btn" id="settingsBtn" aria-label="Settings"></button>
  </header>
  <div id="updateBar" class="update-bar" hidden><span>A new version is ready.</span><button class="btn sm light" id="updateNow">Update now</button></div>
  <main id="view" class="view" tabindex="-1"></main>
  <nav class="tabbar" aria-label="Sections">
    <button data-tab="today" class="tab"><span class="tab-ico"></span><span>Today</span></button>
    <button data-tab="days" class="tab"><span class="tab-ico"></span><span>Days</span></button>
    <button data-tab="ask" class="tab tab-ask"><span class="tab-ico"></span><span>Ask</span></button>
    <button data-tab="docs" class="tab"><span class="tab-ico"></span><span>Docs</span></button>
    <button data-tab="more" class="tab"><span class="tab-ico"></span><span>More</span></button>
  </nav>
</div>

<!-- document viewer -->
<div id="viewer" class="overlay" hidden role="dialog" aria-modal="true" aria-labelledby="viewerTitle">
  <div class="overlay-bar">
    <button class="icon-btn" id="viewerClose" aria-label="Close"></button>
    <div class="overlay-title" id="viewerTitle">Document</div>
    <a class="icon-btn" id="viewerDownload" aria-label="Save" download></a>
  </div>
  <div class="viewer-body" id="viewerBody"></div>
</div>

<!-- image zoom -->
<div id="zoom" class="overlay dark" hidden role="dialog" aria-modal="true">
  <div class="overlay-bar"><button class="icon-btn" id="zoomClose" aria-label="Close"></button><div class="overlay-title" id="zoomTitle"></div><span></span></div>
  <div class="zoom-body"><img id="zoomImg" alt=""></div>
</div>

<!-- show-the-driver card -->
<div id="driver" class="overlay driver" hidden role="dialog" aria-modal="true">
  <div class="overlay-bar"><button class="icon-btn" id="driverClose" aria-label="Close"></button><div class="overlay-title">Show the driver</div><span></span></div>
  <div class="driver-body"><p id="driverTr" class="driver-tr"></p><p id="driverEn" class="driver-en"></p></div>
</div>

<!-- bottom sheet -->
<div id="sheet" class="sheet-wrap" hidden>
  <div class="sheet-scrim" data-close-sheet></div>
  <div class="sheet" role="dialog" aria-modal="true"><div class="sheet-grip"></div><div id="sheetBody"></div></div>
</div>

<div id="toast" class="toast" hidden role="status"></div>

<!-- file pickers: a ticket or document to add, and a backup to restore -->
<input type="file" id="docInput" accept="application/pdf,image/*,audio/*" hidden>
<input type="file" id="restoreInput" accept="application/json,.json" hidden>

<script type="module" src="./app.js"></script>
</body>
</html>
